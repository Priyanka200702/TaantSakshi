<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="TantSaakshi">
  <title>TantSaakshi · তাঁতসাক্ষী — witness of the loom</title>
  <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ecd287"/><stop offset="1" stop-color="#b8902a"/></linearGradient><clipPath id="iris"><circle cx="32" cy="32" r="11.4"/></clipPath></defs>
  <circle cx="32" cy="32" r="31" fill="#fdf9f3"/>
