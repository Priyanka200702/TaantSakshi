  <circle cx="32" cy="32" r="27" fill="none" stroke="#c9a43c" stroke-width="1.1" stroke-dasharray="0.1 3" stroke-linecap="round"/>
  <!-- the shuttle, shaped like a watching eye -->
  <path d="M6.5 32C15 17.5 49 17.5 57.5 32C49 46.5 15 46.5 6.5 32Z" fill="#6d1d2e"/>
